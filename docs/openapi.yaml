openapi: 3.0.0
info:
  title: Dashboard API
  description: API documentation for the Dashboard application
  version: 1.0.0
servers:
  - url: http://localhost:3001/api
    description: Local development server
paths:
  /projects:
    get:
      summary: Get all projects
      responses:
        '200':
          description: A list of projects
    post:
      summary: Create a new project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                path:
                  type: string
                desc:
                  type: string
                branch:
                  type: string
                tech:
                  type: string
      responses:
        '200':
          description: Project created successfully
  /projects/{id}:
    put:
      summary: Update a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Project updated
    delete:
      summary: Delete a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Project deleted
  /analyze:
    post:
      summary: Analyze a project directory to discover tasks and tech stack
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                directory:
                  type: string
      responses:
        '200':
          description: Analysis results
  /deploy:
    post:
      summary: Deploy or launch an AI agent on a project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                agent:
                  type: string
                directory:
                  type: string
      responses:
        '200':
          description: Agent launched
  /deploy/targets:
    get:
      summary: List available deployment targets
      responses:
        '200':
          description: Array of deployment targets
  /deploy/status:
    get:
      summary: Get current deployment status and last deploy record
      responses:
        '200':
          description: Current deployment state
  /deploy/health:
    get:
      summary: Health check remote CT8 host
      responses:
        '200':
          description: Remote host health metrics
  /deploy/start:
    post:
      summary: Trigger deployment to one or more remote targets
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                environment:
                  type: string
                targets:
                  type: array
                  items:
                    type: string
                confirm:
                  type: string
      responses:
        '200':
          description: Deployment initiated
  /deploy/abort:
    post:
      summary: Abort active deployment process
      responses:
        '200':
          description: Deployment process aborted
  /deploy/kill-remote:
    post:
      summary: Kill hung remote processes and restart domain
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                target:
                  type: string
      responses:
        '200':
          description: Remote processes terminated and domain restarted
  /deploy/logs:
    get:
      summary: Get buffered deployment log entries
      responses:
        '200':
          description: Array of logs
  /scheduler/tasks:
    get:
      summary: Get all scheduled background tasks
      responses:
        '200':
          description: List of scheduled tasks
    post:
      summary: Create a new scheduled task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                command:
                  type: string
                cron_expression:
                  type: string
                enabled:
                  type: boolean
      responses:
        '201':
          description: Task created
  /scheduler/tasks/{id}:
    get:
      summary: Get single task by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Task details
    put:
      summary: Update scheduled task
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                command:
                  type: string
                cron_expression:
                  type: string
                enabled:
                  type: boolean
      responses:
        '200':
          description: Task updated
    delete:
      summary: Delete scheduled task
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Task deleted
  /scheduler/tasks/{id}/toggle:
    patch:
      summary: Toggle task active/inactive status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Task status toggled
  /scheduler/tasks/{id}/run:
    post:
      summary: Run scheduled task immediately
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Task execution started
  /scheduler/presets:
    get:
      summary: Get predefined task presets
      responses:
        '200':
          description: List of task presets
