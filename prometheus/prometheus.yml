global:
  scrape_interval: 15s
  evaluation_interval: 15s
  # Attach a label to all metrics scraped by this Prometheus instance
  external_labels:
    monitor: "Prometeush-1"

scrape_configs:
  - job_name: 'dashboard_backend'
    static_configs:
      - targets: ['localhost:3001']
        labels:
          env: 'development'
    metrics_path: '/metrics'
    scheme: http

  - job_name: 'llama_server'
    static_configs:
      - targets: ['llama_proxy:80']
    metrics_path: '/metrics'
    scheme: http
