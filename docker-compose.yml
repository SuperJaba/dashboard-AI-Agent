services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    restart: unless-stopped

  llama_proxy:
    image: nginx:alpine
    container_name: llama_proxy
    command: >
      sh -c "echo 'server { listen 80; location /metrics { proxy_pass \"http://host.docker.internal:1337/v1/metrics?model=AtomicChat/qwen35-4b-Q8_0\"; } }' > /etc/nginx/conf.d/default.conf && nginx -g 'daemon off;'"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
    restart: unless-stopped

  playwright:
    image: mcr.microsoft.com/playwright:focal
    container_name: playwright
    depends_on:
      - grafana
      - prometheus
    working_dir: /workspace/playwright
    volumes:
      - ./:/workspace
    command: ["npx", "playwright", "test"]
    environment:
      - PLAYWRIGHT_BROWSERS_PATH=0
    restart: "no"

  postgres:
    image: postgres:18
    container_name: postgres-dashboard
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER:-SebaP}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-110112}
      POSTGRES_DB: ${DB_NAME:-dashboard}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - postgres_data:/var/lib/postgresql

  opsramp_mock:
    image: node:20-alpine
    container_name: opsramp_mock
    working_dir: /app
    volumes:
      - ./scripts/opsramp-mock-server.js:/app/server.js:ro
    command: ["node", "server.js"]
    ports:
      - "8085:8085"
    environment:
      - PORT=8085
      - TENANT_ID=${OPSRAMP_TENANT_ID:-client_mock_corp_01}
    restart: unless-stopped

volumes:
  postgres_data:


