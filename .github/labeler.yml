# Configuration for actions/labeler v5
frontend:
  - changed-files:
      - any-glob-to-any-file:
          - 'src/components/**'
          - 'src/hooks/**'
          - 'src/*.tsx'
          - 'src/*.ts'
          - 'src/*.css'

backend:
  - changed-files:
      - any-glob-to-any-file:
          - 'src/backend/**'
          - 'server.js'

ci:
  - changed-files:
      - any-glob-to-any-file:
          - '.github/**'

documentation:
  - changed-files:
      - any-glob-to-any-file:
          - 'docs/**'
          - '*.md'

dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - 'package.json'
          - 'package-lock.json'
