name: CI/CD

on:
  push:
    branches: [ "master", "dev" ]
  pull_request:
    branches: [ "master", "dev" ]
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy to CT8 after tests pass'
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    # Only use Node.js 24 to avoid duplicated jobs.
    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      # Reuse node_modules from the main job by running the same install step.
      - name: Install dependencies
        run: npm ci

      - name: Static code analysis (Lint)
        run: npm run lint

      - name: Type checking
        run: npx tsc --noEmit

      - name: Run unit tests
        run: npm test

      - name: Run native system tests (T10.1)
        run: npm run test:sys

      - name: Security vulnerability audit (T10.3)
        run: npm audit --audit-level=high

      - name: Build production bundle
        run: npm run build

      - name: Upload build artifact
        if: matrix.node-version == '24.x'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: dist/
          retention-days: 7

  e2e:
    name: Playwright E2E Tests (T10.2)
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E tests
        run: npm run test:e2e

      - name: Upload Playwright Report on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  deploy-ct8:
    name: Deploy to CT8
    needs: build-and-test
    if: (github.ref == 'refs/heads/master' && github.event_name == 'push') || (github.event_name == 'workflow_dispatch' && inputs.deploy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download frontend distribution artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: dist

      - name: Install deployment prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y sshpass

      - name: Execute CT8 deployment script
        env:
          CT8_PASSWORD: ${{ secrets.CT8_PASSWORD }}
          SKIP_FRONTEND_BUILD: "true"
        run: |
          chmod +x ./scripts/deploy-ct8-optimized.sh
          ./scripts/deploy-ct8-optimized.sh production
