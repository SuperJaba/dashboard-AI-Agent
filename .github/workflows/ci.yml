name: CI/CD

on:
  push:
    branches: [ "master", "dev" ]
    tags: ['v*']
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [ "master", "dev" ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy to CT8 after tests pass'
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' && !startsWith(github.ref, 'refs/tags/v') }}

permissions:
  contents: read
  packages: write  # Required for Docker registry access if needed

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NODE_VERSION: '24.x'

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      # Reuse node_modules from the main job by running the same install step.
      - name: Install dependencies
        run: npm ci

      - name: Static code analysis (Lint)
        run: npm run lint

      - name: Type checking
        run: npx tsc --noEmit

      - name: Run unit tests
        run: npm test

      - name: Run native system tests (T10.1)
        run: npm run test:sys

      - name: Security vulnerability audit (T10.3)
        run: npm audit --audit-level=high

      - name: Build production bundle
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frontend-build
          path: dist/
          retention-days: 7

  e2e:
    name: Playwright E2E Tests (T10.2)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: build-and-test
    if: github.event_name == 'pull_request'
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.2.2
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright OS dependencies
        run: npx playwright install-deps chromium

      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Run Playwright E2E tests
        run: npm run test:e2e

      - name: Upload Playwright Report on Failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  security-scan:
    name: Security Scan (Trivy)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: build-and-test
    if: github.event_name == 'push'
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results.sarif"

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: always()
        continue-on-error: true
        with:
          sarif_file: "trivy-results.sarif"

  deploy-ct8:
    name: Deploy to CT8
    needs: [build-and-test, security-scan]
    if: ((github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')) && github.event_name == 'push') || (github.event_name == 'workflow_dispatch' && inputs.deploy)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    environment:
      name: production
      url: https://dashboard.jagger2.ct8.pl

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Download frontend distribution artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.1
        with:
          name: frontend-build
          path: dist

      - name: Install deployment prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y sshpass

      - name: Execute CT8 deployment script
        env:
          CT8_PASSWORD: ${{ secrets.CT8_PASSWORD }}
          SKIP_FRONTEND_BUILD: "true"
        run: |
          chmod +x ./scripts/deploy-ct8-optimized.sh
          ./scripts/deploy-ct8-optimized.sh production
